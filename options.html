<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历字段助手 · 设置</title><link rel="stylesheet" href="style.css"></head><body><main class="settings"><header><span class="logo">简历字段助手</span><span>资料设置</span></header><h1>先准备资料，再填写网申。</h1><p class="lead">常用信息与选填信息分开管理。所有资料仅保存在本机 Chrome；不用的字段可以留空。</p><nav class="section-nav"><a href="#profile-sections">个人资料</a><a href="#api-card">AI 接口</a></nav><div id="profile-sections"></div><section class="card" id="api-card"><div class="card-heading"><h2>AI 接口</h2><span>必填</span></div><p class="hint">填写兼容 OpenAI Chat Completions 的完整 HTTPS 地址、模型名和密钥。其他格式可通过自建适配网关接入。</p><label>API 地址<input id="url" type="url" placeholder="https://api.example.com/v1/chat/completions"></label><label>模型名称<input id="model" type="text" placeholder="模型 ID"></label><label>API Key<input id="key" type="password" autocomplete="off" placeholder="仅存储在本机浏览器"></label><p class="hint">识别时发送网页字段描述及已填写字段名称，不发送资料值。</p></section><div class="actions"><button id="save" class="primary">保存设置</button><button id="clear" class="secondary">清除本地资料与密钥</button><span id="status" role="status"></span></div></main><script type="module" src="options.js"></script></body></html>
